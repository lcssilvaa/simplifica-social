services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_NAME: ${APP_NAME:-Simplifica Social}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      MAX_SESSIONS: ${MAX_SESSIONS:-1000}
      MAX_MESSAGES_PER_SESSION: ${MAX_MESSAGES_PER_SESSION:-100}
      ENABLE_SESSION_INSPECTION: ${ENABLE_SESSION_INSPECTION:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
